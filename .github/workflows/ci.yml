name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flos
          POSTGRES_PASSWORD: flos
          POSTGRES_DB: flos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flos:flos@localhost:5432/flos_test
      DATABASE_URL: postgresql://flos:flos@localhost:5432/flos_test
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for turbo --affected to diff against the base branch

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to the test database
        run: pnpm --filter @flos/db migrate:deploy

      # On PRs only the packages affected by the change (and their dependents) run.
      - name: Lint, typecheck and test
        run: pnpm turbo run lint typecheck test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
