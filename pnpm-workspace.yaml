packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5

# Expo / React Native resolve native modules most reliably from a flat node_modules.
nodeLinker: hoisted
